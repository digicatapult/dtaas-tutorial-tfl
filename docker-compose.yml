services:
  neo4j:
    image: neo4j:5-community@sha256:414adfe41c6ff32abb752be37f265c77607c166cab298f65a917fc4f05776218
    container_name: neo4j
    restart: "no"
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/testpassword
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:7474"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  influxdb:
    image: influxdb:2.9@sha256:a450f6faf9573e6c2e96a0f575885ae8b7387cc87e4de94599e247ebfa3ac417
    container_name: influxdb
    restart: "no"
    ports:
      - "8086:8086"
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=testpassword
      - DOCKER_INFLUXDB_INIT_ORG=UKDTC
      - DOCKER_INFLUXDB_INIT_BUCKET=TFL
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=test-token-123
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  wiremock:
    image: wiremock/wiremock:3.13.2@sha256:0d4ecb3e4dc8213fd7a4d37d6a78f6e6b553a6d2e15bd51b0999781282ac61b3
    container_name: wiremock
    restart: "no"
    ports:
      - "8080:8080"
    volumes:
      - ./tests/wiremock:/home/wiremock:ro
    command: ["--verbose"]

  emqx:
    image: emqx/emqx:6@sha256:135116400e11b25224350b2e55c874f4e224d357b593fb554ca1b1f398c631ac
    container_name: emqx
    restart: "no"
    ports:
      - "1883:1883"
      - "18083:18083"
    profiles:
      - mqtt
    healthcheck:
      test: ["CMD", "emqx", "ctl", "status"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
