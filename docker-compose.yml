services:
  neo4j:
    image: neo4j:5-community@sha256:577eb43120e8688e62e753e962c47d30044ecaa95147ee5386c29f226b878008
    container_name: neo4j
    restart: "no"
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/testpassword
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:7474"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  influxdb:
    image: influxdb:2.9@sha256:e4572d094ac3272f06528ea904ce6b4cb3bb19be2db3b3b1acbd27ba5c3a73e2
    container_name: influxdb
    restart: "no"
    ports:
      - "8086:8086"
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=testpassword
      - DOCKER_INFLUXDB_INIT_ORG=UKDTC
      - DOCKER_INFLUXDB_INIT_BUCKET=TFL
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=test-token-123
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  wiremock:
    image: wiremock/wiremock:3.13.2@sha256:0d4ecb3e4dc8213fd7a4d37d6a78f6e6b553a6d2e15bd51b0999781282ac61b3
    container_name: wiremock
    restart: "no"
    ports:
      - "8080:8080"
    volumes:
      - ./tests/wiremock:/home/wiremock:ro
    command: ["--verbose"]

  emqx:
    image: emqx/emqx:6@sha256:54778dba62a5cbcb03ca381c9bceb3d8a87cab9e3da155ed3607d994454df900
    container_name: emqx
    restart: "no"
    ports:
      - "1883:1883"
      - "18083:18083"
    profiles:
      - mqtt
    healthcheck:
      test: ["CMD", "emqx", "ctl", "status"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
