[tool.poetry]
name = "dtaas-tutorial-tfl"
version = "0.1.11"
description = "DTaaS Tutorial using Transport for London API"
authors = []
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.14.6,<3.15"
requests = "^2.34.2"
neo4j = "^6.2.0"
influxdb-client = "^1.50.0"
paho-mqtt = "^2.1.0"
fastapi = "^0.138.1"
uvicorn = {version = "^0.49.0", extras = ["standard"]}
python-dotenv = "^1.2.2"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-asyncio (>=1.4.0,<2.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "pytest-mock (>=3.15.1,<4.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "responses (>=0.26.1,<0.27.0)",
    "pylint (>=4.0.6,<5.0.0)",
    "black (>=26.5.1,<27.0.0)",
    "mypy (>=2.1.0,<2.1.1)",
    "playwright (>=1.60.0,<2.0.0)",
    "pytest-playwright (>=0.8.0,<1.0.0)"
]

# ---- Tool Configuration ----

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "unit: Unit tests (no external services required)",
    "integration: Integration tests (require Docker Compose services)",
    "e2e: End-to-end tests (full pipeline, optional)",
]
addopts = "-m 'not integration and not e2e'"

[tool.pylint.messages_control]
disable = ["C", "R", "W"]

[tool.black]
line-length = 88
target-version = ["py313"]

[tool.mypy]
packages = ["agents", "legacy", "visualisation"]
files = ["config.py"]
ignore_missing_imports = true
disable_error_code = ["import-untyped", "var-annotated"]

[tool.coverage.run]
source = ["agents", "legacy", "visualisation", "config"]

[tool.coverage.report]
show_missing = true
skip_empty = true
