name: Test

on:
  pull_request:
    types: [opened, reopened, synchronize]

jobs:
  dtdl-validation:
    name: Validate DTDL
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Install dtdl-parser
        run: npm install @digicatapult/dtdl-parser
      - name: Validate DTDL
        run: node scripts/validate-dtdl.mjs

  lint:
    name: Lint, format, and type check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Install poetry
        run: pipx install poetry
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: poetry
      - name: Install packages
        run: poetry install --no-interaction --no-ansi
      - name: Lint
        run: poetry run pylint agents/ legacy/ visualisation/ config.py --disable=C,R,W
      - name: Format check
        run: poetry run black --check .
      - name: Type check
        run: poetry run mypy agents/ legacy/ visualisation/ config.py

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Install poetry
        run: pipx install poetry
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: poetry
      - name: Install packages
        run: poetry install --no-interaction --no-ansi
      - name: Run unit tests
        run: poetry run pytest -v -s --cov=agents --cov=legacy --cov=visualisation --cov=config --cov-report=term-missing

  integration-tests:
    name: Integration tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Install poetry
        run: pipx install poetry
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: poetry
      - name: Start test services
        run: docker compose up -d --wait
      - name: Install packages
        run: poetry install --no-interaction --no-ansi
      - name: Run integration tests
        run: poetry run pytest -m integration -v -s

  e2e-tests:
    name: E2E tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Install poetry
        run: pipx install poetry
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: poetry
      - name: Start test services
        run: docker compose up -d --wait
      - name: Install packages
        run: poetry install --no-interaction --no-ansi
      - name: Install Playwright browsers
        run: poetry run playwright install --with-deps chromium
      - name: Run e2e tests
        run: poetry run pytest -m e2e -v -s
